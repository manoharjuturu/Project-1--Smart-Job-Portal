<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h1>Create Account</h1>
            <p>Join us and find your dream job</p>
        </div>

        <form ng-submit="signup()" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" ng-model="userData.name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" ng-model="userData.email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" ng-model="userData.password" placeholder="Create a password (min 6 characters)" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" ng-model="userData.confirmPassword" placeholder="Confirm your password" required>
            </div>

            <div class="message" ng-if="message" ng-class="messageType">
                <i class="fas" ng-class="messageType === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
                {{message}}
            </div>

            <button type="submit" class="auth-btn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="#!/login" ng-click="goToLogin()">Sign in</a></p>
        </div>
    </div>
</div>
