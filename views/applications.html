<div class="applications-container">
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-clipboard-list"></i> My Applications</h1>
            <p>Track the status of your job applications</p>
        </div>

        <div class="filter-section">
            <label>Filter by Status:</label>
            <select ng-model="statusFilter">
                <option ng-repeat="status in statusOptions" value="{{status}}">
                    {{status || 'All Statuses'}}
                </option>
            </select>
        </div>

        <div class="applications-list" ng-if="applications.length > 0">
            <div class="application-card" 
                 ng-repeat="app in applications | filter:statusFilter"
                 ng-class="getStatusClass(app.status)">
                <div class="application-header">
                    <div class="application-job-info">
                        <h3>{{app.job.title}}</h3>
                        <p class="company-name"><i class="fas fa-building"></i> {{app.job.company}}</p>
                    </div>
                    <span class="status-badge" ng-class="getStatusClass(app.status)">
                        {{app.status}}
                    </span>
                </div>
                <div class="application-details">
                    <div class="detail-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>{{app.job.location}}</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-dollar-sign"></i>
                        <span>{{app.job.salary}}</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-calendar"></i>
                        <span>Applied: {{formatDate(app.appliedDate)}}</span>
                    </div>
                </div>
                <div class="application-actions">
                    <button class="view-job-btn" ng-click="viewJob(app.job.id)">
                        <i class="fas fa-eye"></i> View Job Details
                    </button>
                </div>
            </div>
        </div>

        <div class="no-applications" ng-if="applications.length === 0">
            <i class="fas fa-clipboard-list"></i>
            <h3>No Applications Yet</h3>
            <p>Start applying to jobs to see them here</p>
            <a href="#!/jobs" class="browse-jobs-btn">
                <i class="fas fa-briefcase"></i> Browse Jobs
            </a>
        </div>
    </div>
</div>
